<datalist id="pl">${[...new Set(a.trades.map(t=>t.pair))].map(p=>`<option>${esc(p)}`).join("")}</datalist></div><div><label>Direction</label><select id="f_dir"><option>Long<option>Short</select></div></div>
<label>Date and time</label><input id="f_date" type="datetime-local" value="${nowL()}"><div class="fl"><div><label>Session</label><select id="f_ses"><option>Asia<option>London<option>Overlap<option>New York</select></div><div><label>Grade</label><select id="f_gr"><option>A<option>B<option>C</select></div></div>
<label>Setup</label><input id="f_set" list="sl" placeholder="Pullback"><datalist id="sl">${[...new Set(a.trades.map(t=>t.setup))].map(p=>`<option>${esc(p)}`).join("")}</datalist>
<div class="fl"><div><label>Status</label><select id="f_st" onchange="$('#cl').style.display=this.value=='closed'?'':'none';$('#op').style.display=this.value=='open'?'':'none'"><option value="closed">Closed<option value="open">Open</select></div><div><label>Plan</label><select id="f_pl"><option value="1">On plan<option value="0">Off plan</select></div></div>
<div id="cl"><div class="fl"><div><label>Pips</label><input id="f_pips" type="number" step="any"></div><div><label>P&amp;L (€)</label><input id="f_pnl" type="number" step="any"></div><div><label>R</label><input id="f_r" type="number" step="any"></div></div></div>
<div id="op" style="display:none"><div class="fl"><div><label>Entry</label><input id="f_en" type="number" step="any"></div><div><label>Lots</label><input id="f_lots" type="number" step="any"></div></div></div>
<label>Notes</label><textarea id="f_notes" rows="3" placeholder="Why you took it, what you saw, what to review"></textarea><label>Chart picture</label><input id="f_img" type="file" accept="image/*" onchange="pickImg(this)"><img id="f_prev" alt="Chart preview" style="display:none;width:100%;border-radius:10px;margin-bottom:10px"><button class="btn" style="width:100%" onclick="saveTrade()">Save trade</button>`)}
function saveTrade(){const v=i=>$("#"+i).value,n=i=>parseFloat(v(i))||0,st=v("f_st");if(!v("f_pair").trim())return toast("Enter a pair");
A().trades.push({id:uid(),pair:v("f_pair").trim().toUpperCase(),dir:v("f_dir"),date:v("f_date")||nowL(),session:v("f_ses"),grade:v("f_gr"),setup:v("f_set").trim()||"—",plan:v("f_pl")=="1",status:st,notes:v("f_notes"),img:IMG,pips:st=="closed"?n("f_pips"):0,pnl:st=="closed"?n("f_pnl"):0,r:st=="closed"?n("f_r"):0,entry:n("f_en"),lots:n("f_lots")});save();closeM();render();toast("Trade saved")}
function tradeSheet(id){const t=A().trades.find(x=>x.id===id);modal(`<h3>${esc(t.pair)} <span class="${t.dir=="Long"?"g":"r"}">${t.dir}</span></h3><p class="m">${tfmt(T(t.date))} · ${esc(t.session)} · ${esc(t.setup)} · grade ${esc(t.grade)} · ${t.plan?"on plan":"off plan"}</p>${t.notes?`<div style="white-space:pre-wrap;margin-bottom:12px">${esc(t.notes)}</div>`:""}${t.img?`<img src="${t.img}" alt="Trade chart" style="width:100%;border-radius:12px;margin-bottom:12px">`:""}<label>${t.img?"Replace":"Add"} chart picture</label><input type="file" accept="image/*" onchange="attachImg('${id}',this)">
${t.status=="open"?`<div class="fl"><div><label>Pips</label><input id="c_pips" type="number" step="any"></div><div><label>P&amp;L (€)</label><input id="c_pnl" type="number" step="any"></div><div><label>R</label><input id="c_r" type="number" step="any"></div></div><button class="btn" style="width:100%;margin-bottom:10px" onclick="closeTrade('${id}')">Close trade</button>`:`<div class="val ${cl(t.pnl)}">${sm(t.pnl)}</div>`}<button class="btn d" style="width:100%;margin-top:10px" onclick="delTrade('${id}')">Delete trade</button>`)}
function closeTrade(id){const t=A().trades.find(x=>x.id===id),n=i=>parseFloat($("#"+i).value)||0;Object.assign(t,{status:"closed",pips:n("c_pips"),pnl:n("c_pnl"),r:n("c_r")});save();closeM();render()}
function delTrade(id){const a=A();a.trades=a.trades.filter(t=>t.id!==id);save();closeM();render()}
function cashSheet(type){modal(`<h3>${type=="w"?"Withdrawal":"Deposit"}</h3><label>Amount (€)</label><input id="x_amt" type="number" step="any" inputmode="decimal"><label>Date</label><input id="x_date" type="date" value="${nowL().slice(0,10)}"><label>Note</label><input id="x_note" placeholder="Optional"><button class="btn" style="width:100%" onclick="saveCash('${type}')">Save ${type=="w"?"withdrawal":"deposit"}</button>`)}
function saveCash(type){const amt=Math.abs(parseFloat($("#x_amt").value));if(!amt)return toast("Enter an amount");A().cash.push({id:uid(),type,amt,date:$("#x_date").value,note:$("#x_note").value});save();closeM();render()}
function delCash(id){modal(`<h3>Delete entry?</h3><p class="m">This removes it from your totals.</p><button class="btn d" style="width:100%" onclick="A().cash=A().cash.filter(x=>x.id!=='${id}');save();closeM();render()">Delete</button>`)}
function switchSheet(){modal(`<h3>Accounts</h3>${S.accts.map(a=>`<div class="tr" onclick="S.cur='${a.id}';save();closeM();render()"><div class="row"><b>${esc(a.name)}</b><span class="${a.id==S.cur?"g":"m"}">${a.id==S.cur?"Active":""}</span></div><div class="m s">${esc(a.number)} · ${money(series(a,"all").bal)}</div></div>`).join("")}<h3 style="margin-top:20px">Add account</h3><label>Name</label><input id="n_name" placeholder="Prop firm 100K"><label>Account number</label><input id="n_num" placeholder="#000000"><label>Starting balance (€)</label><input id="n_bal" type="number" inputmode="decimal">${limFields({})}<button class="btn" style="width:100%" onclick="addAcct()">Add account</button>`)}
function addAcct(){const n=$("#n_name").value.trim();if(!n)return toast("Name the account");const a={id:uid(),name:n,number:$("#n_num").value.trim()||"—",start:parseFloat($("#n_bal").value)||0,trades:[],cash:[],...readLim()};S.accts.push(a);S.cur=a.id;save();closeM();render()}
function acctSheet(){const a=A();modal(`<h3>Account settings</h3><label>Name</label><input id="e_name" value="${esc(a.name)}"><label>Account number</label><input id="e_num" value="${esc(a.number)}"><label>Starting balance (€)</label><input id="e_bal" type="number" value="${a.start}">${limFields(a)}<button class="btn" style="width:100%;margin-bottom:10px" onclick="saveAcct()">Save changes</button>
${S.accts.length>1?`<button class="btn d" style="width:100%" onclick="delAcct()">Delete this account</button>`:""}`)}
function saveAcct(){const a=A();a.name=$("#e_name").value.trim()||a.name;a.number=$("#e_num").value.trim()||a.number;a.start=parseFloat($("#e_bal").value)||0;Object.assign(a,readLim());save();closeM();render()}
function delAcct(){S.accts=S.accts.filter(a=>a.id!==S.cur);S.cur=S.accts[0].id;save();closeM();render()}
render();
</script></body></html>
